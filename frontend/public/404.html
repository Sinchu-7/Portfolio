<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Sinchana Poojary Portfolio</title>
    <style>
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --accent: #58a6ff;
        --text: #f0f6fc;
        --text-muted: #8b949e;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 40px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 3rem;
        margin: 0 0 12px 0;
        color: var(--accent);
      }
      h2 {
        font-size: 1.5rem;
        margin: 0 0 16px 0;
      }
      p {
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 24px;
      }
      a.button {
        display: inline-block;
        background: var(--accent);
        color: #0d1117;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      a.button:hover {
        opacity: 0.9;
      }
    </style>
    <script>
      // Single Page App redirect for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        // If navigating to subpath, redirect to root with path query
        if (path && path !== '/' && !path.endsWith('.html')) {
          var segment = path.split('/').filter(Boolean).pop();
          if (segment && segment !== 'Portfolio') {
            window.location.replace('./#' + segment + search + hash);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you are looking for doesn't exist or has moved. Return to Sinchana Poojary's portfolio to explore projects, experience, and contact details.</p>
      <a href="./" class="button">Return to Portfolio</a>
    </div>
  </body>
</html>
